name: Verify and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.16.0
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm run lint
      - name: Type check
        run: pnpm run typecheck
      - name: Build and test
        run: pnpm test
      - name: Upload Next.js build artifact
        uses: actions/upload-artifact@v4
        with:
          name: team-os-next-build-${{ github.sha }}
          path: .next/
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

  verify-mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - name: Check out source
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - name: Install mobile dependencies
        run: npm ci
      - name: Type check mobile app
        run: npx tsc --noEmit
      - name: Validate Expo configuration
        run: npx expo config --type public
      - name: Validate release icon
        run: node scripts/check-release-assets.mjs
      - name: Validate router security patch compatibility
        run: node scripts/check-router-compat.cjs
      - name: Audit mobile dependencies
        run: npm audit --audit-level=moderate
      - name: Generate iOS project (catch native asset failures)
        run: npx expo prebuild --platform ios --no-install
      - name: Bundle iOS UI (synthetic config; not a release artifact)
        env:
          EXPO_PUBLIC_SUPABASE_URL: https://example.supabase.co
          EXPO_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_test_placeholder
        run: npx expo export --platform ios --output-dir "$RUNNER_TEMP/ios-ui-check"
