name: Build and submit verified iOS build to TestFlight

on:
  workflow_dispatch:
    inputs:
      preview_qa_approved:
        description: "Member/sponsor preview QA and release checklist approved"
        type: boolean
        required: true
        default: false

permissions:
  contents: read

concurrency:
  group: eas-ios-submit
  cancel-in-progress: false

jobs:
  build-submit-ios:
    if: inputs.preview_qa_approved == true
    runs-on: ubuntu-latest
    timeout-minutes: 120
    defaults:
      run:
        working-directory: apps/mobile
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.13.0
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install mobile dependencies
        run: npm ci

      - name: Verify Expo authentication
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "EXPO_TOKEN GitHub secret is missing."
            exit 1
          fi
          npx eas-cli@24.3.0 whoami

      - name: Validate Expo configuration
        run: npx expo config --type public

      - name: Verify mobile source, assets and dependency patch
        run: |
          npx tsc --noEmit
          node scripts/check-release-assets.mjs
          node scripts/check-router-compat.cjs
          npm audit --audit-level=moderate
          npx expo prebuild --platform ios --no-install

      - name: Build this exact checkout
        run: npx eas-cli@24.3.0 build --platform ios --profile production --non-interactive --wait --json > "$RUNNER_TEMP/insuccess-ios-build.json"

      - name: Submit only this successful build (never an unrelated latest build)
        run: |
          BUILD_ID=$(node scripts/check-eas-build.cjs "$RUNNER_TEMP/insuccess-ios-build.json" "$GITHUB_SHA")
          npx eas-cli@24.3.0 submit --platform ios --profile production --id "$BUILD_ID" --non-interactive
