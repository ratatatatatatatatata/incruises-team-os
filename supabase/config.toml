project_id = "incruises-team-os"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[auth]
enabled = true
site_url = "https://incruises-team-os.vercel.app"
additional_redirect_urls = [
  "http://localhost:3000/auth/confirm",
  "https://incruises-team-os.vercel.app/auth/confirm",
]

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# The function validates every bearer token with Supabase Auth getUser before deletion.
# Gateway legacy-JWT verification is disabled to support current Auth signing keys.
[functions.delete-account]
verify_jwt = false
